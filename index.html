<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kornchanok21 | Computer Engineering Student</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">

<style>
/* =========================================================
   🌷 KORNCHANOK21 - PASTEL PROFILE WEBSITE
   ========================================================= */

:root {
  --bg: #fff8fc;
  --surface: rgba(255,255,255,.78);
  --surface-hover: #ffffff;

  --pink: #f5a9c8;
  --pink-dark: #df7fa8;
  --purple: #b9a7e8;
  --blue: #a8d8f0;
  --yellow: #f8df9b;
  --green: #a9dfc5;

  --text: #51465c;
  --muted: #8d8196;
  --line: #f0dce8;

  --shadow: 0 10px 30px rgba(180, 130, 170, .13);
}

/* ---------- พื้นฐาน ---------- */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  color: var(--text);

  font-family:
    "Segoe UI",
    "Noto Sans Thai",
    system-ui,
    sans-serif;

  line-height: 1.75;

  background:
    radial-gradient(circle at 5% 5%, #ffe5f0 0, transparent 25%),
    radial-gradient(circle at 95% 10%, #e6dcff 0, transparent 25%),
    radial-gradient(circle at 80% 90%, #dff6ff 0, transparent 25%),
    var(--bg);
}

/* จุดตกแต่งพื้นหลัง */

body::before {
  content: "✦";
  position: fixed;
  top: 10%;
  left: 7%;
  color: #f3b6cf;
  font-size: 24px;
  opacity: .7;
  pointer-events: none;
}

body::after {
  content: "♡";
  position: fixed;
  right: 7%;
  bottom: 10%;
  color: #bba9e8;
  font-size: 30px;
  opacity: .7;
  pointer-events: none;
}

/* ---------- Container ---------- */

.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 30px 22px 70px;
}

/* ---------- Header ---------- */

.hero {
  position: relative;

  display: flex;
  gap: 25px;
  align-items: center;

  padding: 55px 0 20px;

  flex-wrap: wrap;
}

/* รูปโปรไฟล์ */

.avatar {
  width: 120px;
  height: 120px;

  border-radius: 50%;

  border: 5px solid white;
  outline: 3px solid #f4bfd5;

  object-fit: cover;

  background: #ffeaf3;

  box-shadow:
    0 8px 25px rgba(190, 130, 165, .2);

  flex-shrink: 0;
}

/* ถ้ารูป GitHub โหลดไม่ได้ */

.avatar-fallback {
  width: 120px;
  height: 120px;

  border-radius: 50%;

  border: 5px solid white;
  outline: 3px solid #f4bfd5;

  background:
    linear-gradient(135deg, #ffd7e8, #ddd2fa);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 42px;
  font-weight: 700;

  color: #8c7191;

  box-shadow:
    0 8px 25px rgba(190, 130, 165, .2);
}

.hero-text {
  flex: 1;
  min-width: 240px;
}

/* ตำแหน่ง */

.role {
  display: inline-block;

  font-size: 12px;
  font-weight: 700;

  letter-spacing: .08em;

  color: #b36d91;

  background: #ffe7f1;

  border: 1px solid #f5cadb;

  border-radius: 999px;

  padding: 6px 13px;

  margin: 0 0 12px;
}

/* ชื่อ */

h1 {
  font-size: clamp(34px, 7vw, 52px);

  line-height: 1.1;

  margin: 0 0 10px;

  letter-spacing: -.03em;

  background:
    linear-gradient(
      90deg,
      #d77fa7,
      #9c86d5,
      #73afd0
    );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* คำโปรย */

.tagline {
  font-size: clamp(16px, 2.5vw, 19px);

  color: var(--text);

  margin: 0;

  max-width: 600px;
}

/* ---------- About ---------- */

.about {
  color: var(--muted);

  margin: 25px 0 0;

  max-width: 68ch;

  background: rgba(255,255,255,.5);

  padding: 18px 20px;

  border-radius: 18px;

  border: 1px solid rgba(240,220,232,.8);
}

/* ---------- Links ---------- */

.links {
  display: flex;

  flex-wrap: wrap;

  gap: 10px;

  padding: 0;

  margin: 24px 0 0;

  list-style: none;
}

.links a {
  display: inline-block;

  border: 1px solid #efcddd;

  border-radius: 999px;

  padding: 9px 19px;

  color: #805f78;

  background: rgba(255,255,255,.65);

  text-decoration: none;

  font-size: 14px;

  box-shadow: 0 4px 12px rgba(190,130,165,.08);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background .2s ease;
}

.links a:hover,
.links a:focus-visible {
  transform: translateY(-3px);

  background: white;

  box-shadow:
    0 8px 18px rgba(190,130,165,.18);

  color: #c66f99;
}

/* ---------- Sections ---------- */

section {
  margin-top: 55px;
}

h2 {
  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 17px;

  color: #7d6a82;

  margin: 0 0 20px;

  padding-bottom: 10px;

  border-bottom: 2px dashed #efd8e5;
}

h2::before {
  content: "🌷";
  font-size: 18px;
}

/* ---------- Learning ---------- */

.learning {
  list-style: none;

  padding: 0;

  margin: 0;
}

.learning li {
  position: relative;

  background: rgba(255,255,255,.7);

  border: 1px solid var(--line);

  border-radius: 15px;

  padding: 12px 16px 12px 43px;

  margin-bottom: 12px;

  color: var(--muted);

  box-shadow: var(--shadow);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.learning li::before {
  content: "♡";

  position: absolute;

  left: 17px;
  top: 10px;

  color: #e79abb;

  font-size: 20px;
}

.learning li:hover {
  transform: translateX(5px);

  box-shadow:
    0 12px 25px rgba(180,130,170,.18);
}

/* ---------- Works ---------- */

.works {
  display: grid;

  gap: 15px;

  grid-template-columns:
    repeat(auto-fill, minmax(240px, 1fr));
}

.work {
  border: 1px solid var(--line);

  border-radius: 18px;

  padding: 19px;

  background: rgba(255,255,255,.72);

  box-shadow: var(--shadow);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.work:hover {
  transform: translateY(-5px);

  box-shadow:
    0 15px 30px rgba(180,130,170,.18);
}

.work h3 {
  margin: 0 0 7px;

  font-size: 17px;

  color: #765f79;
}

.work p {
  margin: 0;

  color: var(--muted);

  font-size: 14px;
}

.work a {
  color: #c4779d;

  text-decoration: none;

  font-size: 14px;

  display: inline-block;

  margin-top: 10px;
}

.work a:hover {
  text-decoration: underline;
}

.empty {
  border: 2px dashed #e9cddd;

  border-radius: 18px;

  padding: 28px 20px;

  color: var(--muted);

  background: rgba(255,255,255,.55);

  text-align: center;

  font-size: 15px;
}

/* ---------- Network Panel ---------- */

.panel {
  border: 1px solid var(--line);

  border-radius: 18px;

  background: rgba(255,255,255,.65);

  padding: 5px 20px 18px;

  box-shadow: var(--shadow);
}

.row {
  display: grid;

  grid-template-columns:
    minmax(130px, 1fr)
    minmax(0, 1.5fr);

  gap: 12px;

  padding: 12px 0;

  border-bottom: 1px dashed #ead9e4;

  align-items: baseline;
}

.row:last-of-type {
  border-bottom: 0;
}

.row dt {
  color: var(--muted);

  font-size: 14px;
}

.row dd {
  margin: 0;

  font-family:
    ui-monospace,
    "SF Mono",
    Menlo,
    Consolas,
    monospace;

  font-size: 13px;

  color: #ad6f94;

  word-break: break-all;
}

.row .note {
  display: block;

  color: var(--muted);

  font-family: inherit;

  font-size: 12px;

  margin-top: 2px;
}

.hint {
  color: var(--muted);

  font-size: 13px;

  margin: 15px 0 0;
}

/* ---------- Footer ---------- */

footer {
  margin-top: 60px;

  padding-top: 25px;

  border-top: 2px dashed #efd8e5;

  color: var(--muted);

  font-size: 13px;

  text-align: center;
}

footer a {
  color: #c4779d;
}

/* ---------- Mobile ---------- */

@media (max-width:520px) {

  .wrap {
    padding-left: 17px;
    padding-right: 17px;
  }

  .hero {
    padding-top: 35px;

    justify-content: center;

    text-align: center;
  }

  .hero-text {
    min-width: 100%;
  }

  .avatar,
  .avatar-fallback {
    width: 95px;
    height: 95px;
  }

  .avatar-fallback {
    font-size: 34px;
  }

  .about {
    text-align: center;
  }

  .links {
    justify-content: center;
  }

  .row {
    grid-template-columns: 1fr;

    gap: 2px;
  }

  h1 {
    font-size: 38px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- =====================================================
       🌷 HEADER
       ===================================================== -->

  <header class="hero">

    <img
      class="avatar"
      id="avatar"
      alt=""
      width="120"
      height="120"
    >

    <div class="hero-text">

      <p class="role" id="role"></p>

      <h1 id="name"></h1>

      <p class="tagline" id="tagline"></p>

    </div>

  </header>


  <!-- =====================================================
       💗 ABOUT
       ===================================================== -->

  <p class="about" id="about"></p>

  <ul class="links" id="links"></ul>


  <!-- =====================================================
       📚 LEARNING
       ===================================================== -->

  <section>

    <h2>กำลังเรียนรู้</h2>

    <ul class="learning" id="learning"></ul>

  </section>


  <!-- =====================================================
       💻 WORKS
       ===================================================== -->

  <section>

    <h2>ผลงาน</h2>

    <div class="works" id="works"></div>

  </section>


  <!-- =====================================================
       🌐 NETWORK INFORMATION
       ===================================================== -->

  <section>

    <h2>ข้อมูลการเชื่อมต่อของหน้านี้</h2>

    <div class="panel">

      <dl id="netpanel"></dl>

      <p class="hint">
        กด F12 → Network → Ctrl+F5
        เพื่อดูข้อมูลการเชื่อมต่อจริง
      </p>

    </div>

  </section>


  <!-- =====================================================
       🌷 FOOTER
       ===================================================== -->

  <footer>

    Made with HTML, CSS & JavaScript 🌷
    ·
    <a id="repolink" href="#">
      GitHub
    </a>

  </footer>

</div>


<script>

/* =========================================================
   💗 ข้อมูลของ Kornchanok21
   ========================================================= */

const ME = {

  /* GitHub username */
  github: "Kornchanok21",

  /* ชื่อ */
  name: "กรชนก แสวงนอก",

  /* สถานะ */
  role: "นักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 1 · มทร.อีสาน",

  /* คำโปรย */
  tagline:
    "กำลังเรียนรู้การเขียนโปรแกรม ระบบเครือข่าย และเทคโนโลยี IoT เพื่อสร้างสิ่งที่ใช้งานได้จริง ♡",

  /* แนะนำตัว */
  about:
    "สวัสดีค่ะ เราชื่อกรชนก เป็นนักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 1 สนใจด้านการเขียนโปรแกรม ระบบเครือข่าย และเทคโนโลยี IoT กำลังค่อย ๆ เรียนรู้และพัฒนาทักษะของตัวเองผ่านการเรียนและการทำโปรเจกต์เล็ก ๆ",

  /* สิ่งที่กำลังเรียน */
  learning: [

    "ภาษา C และพื้นฐานการเขียนโปรแกรม",

    "HTML, CSS และ JavaScript",

    "ระบบเครือข่ายและพื้นฐาน IoT",

    "Git และ GitHub",

    "Arduino และอุปกรณ์อิเล็กทรอนิกส์"

  ],

  /* ผลงาน */
  works: [],

  /* ช่องทางติดต่อ */
  links: [

    {
      label: "♡ GitHub",
      url: "https://github.com/Kornchanok21"
    }

  ]

};


/* =========================================================
   ⚙️ แสดงข้อมูล
   ========================================================= */

const $ = (id) =>
  document.getElementById(id);


document.title =
  ME.name + " | Kornchanok21";


$("role").textContent =
  ME.role;

$("name").textContent =
  ME.name;

$("tagline").textContent =
  ME.tagline;

$("about").textContent =
  ME.about;


/* =========================================================
   🌷 รูปโปรไฟล์ GitHub
   ========================================================= */

const avatar =
  $("avatar");

avatar.alt =
  "รูปโปรไฟล์ของ " + ME.name;


avatar.addEventListener(
  "error",
  () => {

    const box =
      document.createElement("div");

    box.className =
      "avatar-fallback";

    box.setAttribute(
      "aria-hidden",
      "true"
    );

    box.textContent =
      ME.name
        .trim()
        .charAt(0);

    avatar.replaceWith(box);

  }
);


avatar.src =
  "https://github.com/"
  + ME.github
  + ".png?size=192";


/* =========================================================
   📚 Learning
   ========================================================= */

for (
  const item of ME.learning || []
) {

  const li =
    document.createElement("li");

  li.textContent =
    item;

  $("learning")
    .appendChild(li);

}


/* =========================================================
   🔗 Links
   ========================================================= */

for (
  const link of ME.links || []
) {

  const a =
    document.createElement("a");

  a.href =
    link.url;

  a.textContent =
    link.label;

  a.target =
    "_blank";

  a.rel =
    "noopener noreferrer";


  const li =
    document.createElement("li");

  li.appendChild(a);

  $("links")
    .appendChild(li);

}


/* =========================================================
   💻 Works
   ========================================================= */

if (
  !ME.works ||
  ME.works.length === 0
) {

  const box =
    document.createElement("div");

  box.className =
    "empty";

  box.textContent =
    "🌷 ยังไม่มีผลงานในหน้านี้ กำลังเรียนรู้อยู่ แล้วจะกลับมาเพิ่มเรื่อย ๆ ♡";

  $("works")
    .appendChild(box);

}

else {

  for (
    const w of ME.works
  ) {

    const card =
      document.createElement("div");

    card.className =
      "work";


    const h3 =
      document.createElement("h3");

    h3.textContent =
      w.title;


    const p =
      document.createElement("p");

    p.textContent =
      w.desc;


    card.append(
      h3,
      p
    );


    if (w.url) {

      const a =
        document.createElement("a");

      a.href =
        w.url;

      a.textContent =
        "ดูผลงาน ↗";

      a.target =
        "_blank";

      a.rel =
        "noopener noreferrer";

      card.appendChild(a);

    }


    $("works")
      .appendChild(card);

  }

}


/* =========================================================
   🐙 GitHub Repository
   ========================================================= */

$("repolink").href =
  "https://github.com/"
  + ME.github
  + "/"
  + ME.github
  + ".github.io";


/* =========================================================
   🌐 Network Information
   ========================================================= */

function ms(v) {

  if (
    typeof v !== "number" ||
    v < 0 ||
    Number.isNaN(v)
  ) {

    return "—";

  }

  return (
    Math.round(v)
    + " ms"
  );

}


window.addEventListener(
  "load",
  () => {

    setTimeout(
      () => {

        const nav =
          performance.getEntriesByType(
            "navigation"
          )[0];


        const rows = [

          [
            "Domain name",

            location.hostname ||
            "(เปิดจากไฟล์ในเครื่อง)",

            "ชื่อโดเมนของเว็บไซต์"
          ],

          [
            "Protocol",

            location.protocol,

            "https คือ HTTP ที่มีการเข้ารหัสข้อมูล"
          ]

        ];


        if (nav) {

          rows.push(

            [
              "HTTP version",

              nav.nextHopProtocol ||
              "—",

              "h2 คือ HTTP/2 และ h3 คือ HTTP/3"
            ],

            [
              "DNS lookup",

              ms(
                nav.domainLookupEnd -
                nav.domainLookupStart
              ),

              "เวลาที่ใช้ค้นหา IP address ของโดเมน"
            ],

            [
              "Connection + TLS",

              ms(
                nav.connectEnd -
                nav.connectStart
              ),

              "เวลาสร้างการเชื่อมต่อกับ server"
            ],

            [
              "TTFB",

              ms(
                nav.responseStart -
                nav.requestStart
              ),

              "Time To First Byte"
            ]

          );

        }


        for (
          const [label, value, note]
          of rows
        ) {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "row";


          const dt =
            document.createElement(
              "dt"
            );

          dt.textContent =
            label;


          const dd =
            document.createElement(
              "dd"
            );

          dd.textContent =
            value;


          const small =
            document.createElement(
              "span"
            );

          small.className =
            "note";

          small.textContent =
            note;


          dd.appendChild(
            small
          );

          row.append(
            dt,
            dd
          );


          $("netpanel")
            .appendChild(row);

        }

      },
      0
    );

  }
);

</script>

</body>
</html>
