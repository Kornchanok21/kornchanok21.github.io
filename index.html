<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kornchanok Weer</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">

<!-- ==========================================================================
     PROFILE ของ Kornchanok Weer
     ========================================================================== -->
<script>
const ME = {

  // GitHub username
  github: "Kornchanok21",

  // ชื่อที่แสดงบนเว็บไซต์
  name: "Kornchanok Weer",

  // สถานะการศึกษา
  role: "นักศึกษาวิศวกรรมคอมพิวเตอร์ ปี 1 · มทร.อีสาน",

  // สิ่งที่สนใจสร้าง
  tagline: "อยากเปลี่ยนไอเดียเล็ก ๆ ให้กลายเป็นเทคโนโลยีที่ใช้งานได้จริง",

  // แนะนำตัว
  about: "สวัสดีค่ะ ฉัน Kornchanok Weer นักศึกษาวิศวกรรมคอมพิวเตอร์ที่กำลังเรียนรู้และค้นหาตัวเองในโลกของเทคโนโลยี สนใจการเขียนโปรแกรม เว็บไซต์ ระบบเครือข่าย และ IoT และอยากพัฒนาทักษะของตัวเองให้สามารถสร้างผลงานที่ทั้งใช้งานได้จริงและมีความเป็นตัวเอง",

  // สิ่งที่กำลังเรียนรู้
  learning: [
    "การเขียนโปรแกรมภาษา C และพื้นฐานการคิดเชิงอัลกอริทึม",
    "HTML, CSS และ JavaScript สำหรับการสร้างเว็บไซต์",
    "ระบบเครือข่ายและพื้นฐาน Network สำหรับงาน IoT",
    "Arduino, Sensors และการสร้างอุปกรณ์ IoT",
    "Git และ GitHub สำหรับจัดเก็บและพัฒนาผลงาน"
  ],

  // ผลงาน
  works: [],

  // ช่องทางติดต่อ
  links: [
    {
      label: "GitHub",
      url: "https://github.com/Kornchanok21"
    }
  ],

  // ธีมเว็บไซต์
  theme: "princess"

};
</script>

<style>

/* ==========================================================================
   PRINCESS LUXURY THEME
   น่ารัก + หรู + คลู
   ========================================================================== */

:root {
  --bg:#fff8fc;
  --line:#ead7e5;
  --text:#3d3040;
  --muted:#806f80;

  --surface:rgba(255,255,255,.72);

  --accent:#d889b5;
  --accent-soft:#b76d9c;

  --glow1:#f8dced;
  --glow2:#e8ddfa;

  --gold:#c8a15a;

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}


/* ---------- ธีมเจ้าหญิง ---------- */

[data-theme="princess"] {
  --bg:#fff8fc;
  --line:#ead7e5;
  --text:#3d3040;
  --muted:#806f80;

  --surface:rgba(255,255,255,.72);

  --accent:#d889b5;
  --accent-soft:#b76d9c;

  --glow1:#f8dced;
  --glow2:#e8ddfa;

  --gold:#c8a15a;
}


/* ---------- พื้นฐาน ---------- */

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  min-height:100vh;

  color:var(--text);

  font-family:
    "Segoe UI",
    "Noto Sans Thai",
    system-ui,
    sans-serif;

  line-height:1.75;

  background:
    radial-gradient(
      900px 450px at 5% -10%,
      var(--glow1) 0,
      transparent 65%
    ),

    radial-gradient(
      850px 430px at 95% 0,
      var(--glow2) 0,
      transparent 60%
    ),

    var(--bg);
}


/* ---------- ตกแต่งดาว ---------- */

body::before {
  content:"✦";
  position:fixed;
  top:90px;
  right:8%;
  color:var(--gold);
  font-size:24px;
  opacity:.55;
  pointer-events:none;
}

body::after {
  content:"✧";
  position:fixed;
  top:45%;
  left:6%;
  color:var(--accent);
  font-size:28px;
  opacity:.35;
  pointer-events:none;
}


/* ---------- ความกว้างเว็บไซต์ ---------- */

.wrap {
  max-width:760px;
  margin:0 auto;
  padding:0 22px 80px;
}


/* ==========================================================================
   HEADER
   ========================================================================== */

.hero {
  display:flex;
  gap:22px;
  align-items:center;

  padding:64px 0 8px;

  flex-wrap:wrap;
}


/* ---------- รูปโปรไฟล์ ---------- */

.avatar {
  width:96px;
  height:96px;

  border-radius:50%;

  border:3px solid #fff;

  outline:2px solid var(--accent);

  object-fit:cover;

  flex-shrink:0;

  background:var(--surface);

  box-shadow:
    0 6px 25px rgba(190,110,160,.18),
    0 0 0 5px rgba(216,137,181,.08);
}


/* ถ้าโหลดรูป GitHub ไม่ได้ */

.avatar-fallback {
  width:96px;
  height:96px;

  border-radius:50%;

  border:3px solid #fff;
  outline:2px solid var(--accent);

  background:
    linear-gradient(
      135deg,
      #f7d9ea,
      #e7dcfa
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:38px;
  font-weight:600;

  color:var(--accent);

  box-shadow:
    0 6px 25px rgba(190,110,160,.18);
}


.hero-text {
  flex:1;
  min-width:240px;
}


/* ---------- ตำแหน่ง ---------- */

.role {
  font:
    600 12px/1 var(--mono);

  letter-spacing:.14em;

  text-transform:uppercase;

  color:var(--accent);

  margin:0 0 10px;
}


/* ---------- ชื่อ ---------- */

h1 {
  font-size:clamp(30px,6vw,46px);

  line-height:1.15;

  margin:0 0 8px;

  letter-spacing:-.02em;

  background:
    linear-gradient(
      90deg,
      #b76d9c,
      #d889b5,
      #b69bd4
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}


/* ---------- คำโปรย ---------- */

.tagline {
  font-size:clamp(17px,2.6vw,20px);

  color:var(--text);

  margin:0;

  opacity:.92;
}


/* ---------- About ---------- */

.about {
  color:var(--muted);

  margin:26px 0 0;

  max-width:62ch;
}


/* ==========================================================================
   LINKS
   ========================================================================== */

.links {
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  padding:0;

  margin:24px 0 0;

  list-style:none;
}


.links a {
  display:inline-block;

  border:1px solid var(--line);

  border-radius:999px;

  padding:9px 20px;

  color:var(--text);

  text-decoration:none;

  font-size:15px;

  background:
    rgba(255,255,255,.5);

  box-shadow:
    0 4px 12px rgba(150,100,140,.06);

  transition:
    border-color .2s ease,
    color .2s ease,
    transform .2s ease,
    box-shadow .2s ease;
}


.links a:hover,
.links a:focus-visible {

  border-color:var(--accent);

  color:var(--accent);

  transform:translateY(-2px);

  box-shadow:
    0 7px 18px rgba(190,110,160,.15);
}


/* ==========================================================================
   SECTION
   ========================================================================== */

section {
  margin-top:52px;
}


h2 {
  font:
    600 12px/1 var(--mono);

  letter-spacing:.16em;

  text-transform:uppercase;

  color:var(--muted);

  border-bottom:1px solid var(--line);

  padding-bottom:10px;

  margin:0 0 20px;
}


/* ==========================================================================
   LEARNING
   ========================================================================== */

.learning {
  list-style:none;

  padding:0;

  margin:0;
}


.learning li {
  border-left:2px solid var(--accent);

  padding:5px 0 5px 16px;

  margin-bottom:14px;

  color:var(--muted);

  background:
    linear-gradient(
      90deg,
      rgba(216,137,181,.06),
      transparent
    );

  border-radius:0 8px 8px 0;
}


/* ==========================================================================
   WORKS
   ========================================================================== */

.works {
  display:grid;

  gap:14px;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(240px,1fr)
    );
}


.work {

  border:1px solid var(--line);

  border-radius:16px;

  padding:16px 18px;

  background:var(--surface);

  box-shadow:
    0 8px 25px rgba(150,100,140,.07);

  transition:
    transform .2s ease,
    box-shadow .2s ease;
}


.work:hover {
  transform:translateY(-3px);

  box-shadow:
    0 12px 30px rgba(150,100,140,.12);
}


.work h3 {
  margin:0 0 6px;

  font-size:17px;
}


.work p {
  margin:0;

  color:var(--muted);

  font-size:14.5px;
}


.work a {
  color:var(--accent-soft);

  text-decoration:none;

  font-size:14px;

  display:inline-block;

  margin-top:10px;
}


.work a:hover {
  text-decoration:underline;
}


.empty {

  border:1px dashed var(--line);

  border-radius:16px;

  padding:26px 20px;

  color:var(--muted);

  text-align:center;

  font-size:15px;

  background:
    rgba(255,255,255,.45);
}


/* ==========================================================================
   NETWORK PANEL
   ========================================================================== */

.panel {

  border:1px solid var(--line);

  border-radius:16px;

  background:var(--surface);

  padding:4px 20px 16px;

  box-shadow:
    0 8px 25px rgba(150,100,140,.06);
}


.row {

  display:grid;

  grid-template-columns:
    minmax(130px,1fr)
    minmax(0,1.5fr);

  gap:12px;

  padding:11px 0;

  border-bottom:1px dashed var(--line);

  align-items:baseline;
}


.row:last-of-type {
  border-bottom:0;
}


.row dt {
  color:var(--muted);

  font-size:14px;

  margin:0;
}


.row dd {
  margin:0;

  font-family:var(--mono);

  font-size:14px;

  color:var(--accent-soft);

  word-break:break-all;
}


.row .note {

  display:block;

  color:var(--muted);

  font-family:inherit;

  font-size:12.5px;
}


.hint {

  color:var(--muted);

  font-size:14px;

  margin:14px 0 0;
}


/* ==========================================================================
   FOOTER
   ========================================================================== */

footer {

  margin-top:56px;

  padding-top:22px;

  border-top:1px solid var(--line);

  color:var(--muted);

  font-size:14px;

  text-align:center;
}


footer a {
  color:var(--accent-soft);
}


/* ==========================================================================
   MOBILE
   ========================================================================== */

@media (max-width:520px) {

  .hero {

    padding-top:44px;

    gap:16px;
  }

  .avatar,
  .avatar-fallback {

    width:72px;
    height:72px;

    font-size:28px;
  }

  .row {

    grid-template-columns:1fr;

    gap:2px;
  }

}

</style>
</head>


<body>

<div class="wrap">


  <!-- ========================================================================
       HEADER
       ======================================================================== -->

  <header class="hero">

    <img
      class="avatar"
      id="avatar"
      alt=""
      width="96"
      height="96"
    >

    <div class="hero-text">

      <p
        class="role"
        id="role">
      </p>

      <h1
        id="name">
      </h1>

      <p
        class="tagline"
        id="tagline">
      </p>

    </div>

  </header>


  <!-- ABOUT -->

  <p
    class="about"
    id="about">
  </p>


  <!-- LINKS -->

  <ul
    class="links"
    id="links">
  </ul>


  <!-- ========================================================================
       LEARNING
       ======================================================================== -->

  <section>

    <h2>กำลังเรียนรู้</h2>

    <ul
      class="learning"
      id="learning">
    </ul>

  </section>


  <!-- ========================================================================
       WORKS
       ======================================================================== -->

  <section>

    <h2>ผลงาน</h2>

    <div
      class="works"
      id="works">
    </div>

  </section>


  <!-- ========================================================================
       NETWORK INFORMATION
       ======================================================================== -->

  <section>

    <h2>ข้อมูลการเชื่อมต่อของหน้านี้</h2>

    <div class="panel">

      <dl id="netpanel"></dl>

      <p class="hint">
        กด F12 เลือกแท็บ Network แล้วกด Ctrl+F5
        เพื่อเปรียบเทียบค่า
      </p>

    </div>

  </section>


  <!-- ========================================================================
       FOOTER
       ======================================================================== -->

  <footer>

    สร้างด้วย HTML, CSS และ JavaScript ·
    โฮสต์บน GitHub Pages ·

    <a
      id="repolink"
      href="https://github.com">
      ดูซอร์สโค้ดของหน้านี้
    </a>

  </footer>


</div>


<script>

/* ==========================================================================
   1) นำข้อมูลจาก ME มาแสดง
   ========================================================================== */

const $ = (id) =>
  document.getElementById(id);


document.title = ME.name;


/* ตั้งธีม */

document.documentElement.dataset.theme =
  ME.theme || "princess";


/* ข้อมูลโปรไฟล์ */

$("role").textContent =
  ME.role;

$("name").textContent =
  ME.name;

$("tagline").textContent =
  ME.tagline;

$("about").textContent =
  ME.about;


/* ==========================================================================
   GitHub Profile Picture
   ========================================================================== */

const avatar =
  $("avatar");


avatar.alt =
  "รูปโปรไฟล์ของ " + ME.name;


avatar.addEventListener(
  "error",
  () => {

    const box =
      document.createElement("div");

    box.className =
      "avatar-fallback";

    box.setAttribute(
      "aria-hidden",
      "true"
    );

    box.textContent =
      (ME.name || "?")
        .trim()
        .charAt(0);

    avatar.replaceWith(box);

  }
);


/* ดึงรูปจาก GitHub */

avatar.src =
  "https://github.com/"
  + ME.github
  + ".png?size=192";


/* ==========================================================================
   Learning
   ========================================================================== */

for (
  const item of ME.learning || []
) {

  const li =
    document.createElement("li");

  li.textContent =
    item;

  $("learning")
    .appendChild(li);

}


/* ==========================================================================
   Links
   ========================================================================== */

for (
  const link of ME.links || []
) {

  const a =
    document.createElement("a");

  a.href =
    link.url;

  a.textContent =
    link.label;

  a.rel =
    "noopener noreferrer";


  const li =
    document.createElement("li");


  li.appendChild(a);


  $("links")
    .appendChild(li);

}


/* ==========================================================================
   Works
   ========================================================================== */

if (
  !ME.works ||
  ME.works.length === 0
) {

  const box =
    document.createElement("div");

  box.className =
    "empty";

  box.textContent =
    "ยังไม่มีผลงานในหน้านี้ กำลังเรียนรู้และสร้างผลงานใหม่ ๆ อยู่ ✦";

  $("works")
    .appendChild(box);

}

else {

  for (
    const w of ME.works
  ) {

    const card =
      document.createElement("div");

    card.className =
      "work";


    const h3 =
      document.createElement("h3");

    h3.textContent =
      w.title;


    const p =
      document.createElement("p");

    p.textContent =
      w.desc;


    card.append(
      h3,
      p
    );


    if (w.url) {

      const a =
        document.createElement("a");

      a.href =
        w.url;

      a.textContent =
        "ดูผลงาน ↗";

      a.rel =
        "noopener noreferrer";

      card.appendChild(a);

    }


    $("works")
      .appendChild(card);

  }

}


/* ==========================================================================
   GitHub Repository Link
   ========================================================================== */

$("repolink").href =
  "https://github.com/"
  + ME.github
  + "/"
  + ME.github
  + ".github.io";


/* ==========================================================================
   Network Information
   ========================================================================== */

function ms(v) {

  if (
    typeof v !== "number" ||
    v < 0 ||
    Number.isNaN(v)
  ) {

    return "—";

  }

  return Math.round(v) + " ms";

}


window.addEventListener(
  "load",
  () => setTimeout(
    () => {

      const nav =
        performance.getEntriesByType(
          "navigation"
        )[0];


      const rows = [

        [
          "Domain name",

          location.hostname ||
          "(เปิดจากไฟล์ในเครื่อง)",

          "ชื่อโดเมนต้องถูกแปลงเป็น IP address ผ่าน DNS ก่อน จึงจะติดต่อ server ได้"
        ],

        [
          "Protocol",

          location.protocol,

          "https คือ HTTP ที่เพิ่มการเข้ารหัสและการยืนยันตัวตน server ด้วย certificate"
        ]

      ];


      if (nav)

        rows.push(

          [

            "HTTP version",

            nav.nextHopProtocol ||
            "—",

            "h2 คือ HTTP/2 และ h3 คือ HTTP/3 ซึ่งส่งหลายไฟล์พร้อมกันได้ในการเชื่อมต่อเดียว"

          ],

          [

            "DNS lookup",

            ms(
              nav.domainLookupEnd -
              nav.domainLookupStart
            ),

            "เวลาที่ใช้แปลงชื่อโดเมนเป็น IP address ถ้าได้ 0 ms แปลว่ามีคำตอบอยู่ใน cache แล้ว"

          ],

          [

            "Connection + TLS",

            ms(
              nav.connectEnd -
              nav.connectStart
            ),

            "เวลาสร้างการเชื่อมต่อ รวมขั้นตอน TLS handshake ก่อนเริ่มรับส่งข้อมูลจริง"

          ],

          [

            "TTFB",

            ms(
              nav.responseStart -
              nav.requestStart
            ),

            "Time To First Byte เวลาตั้งแต่ส่ง request จนได้ข้อมูลไบต์แรกกลับมา ยิ่ง server ไกลยิ่งสูง"

          ]

        );


      for (
        const [label, value, note]
        of rows
      ) {

        const row =
          document.createElement("div");

        row.className =
          "row";


        const dt =
          document.createElement("dt");

        dt.textContent =
          label;


        const dd =
          document.createElement("dd");

        dd.textContent =
          value;


        const small =
          document.createElement("span");

        small.className =
          "note";

        small.textContent =
          note;


        dd.appendChild(
          small
        );


        row.append(
          dt,
          dd
        );


        $("netpanel")
          .appendChild(row);

      }

    },

    0
  )
);

</script>

</body>
</html>
